version: 2.0.0.{build}

assembly_info:
  patch: true
  file: hanyu\Properties\AssemblyInfo.cs
  assembly_version: '{version}'
  assembly_file_version: '{version}'
  assembly_informational_version: '{version}'

branches:
  only:
    - master
build:
  project: hanyu.sln

image: Previous Visual Studio 2019
configuration: Release
platform: Any CPU

before_build:
- cmd: nuget restore

artifacts:
-  path: hanyu\bin\Release\hanyu.exe
   name: executable

deploy:
- provider: GitHub
  auth_token:
    secure: xqpoOQNBJBNn4Oqw5olKGgtkKzUm9LbCLkr4hRDtlqYCPwj/4FgOL+CunI+D/8zYA9AbTRvDpJNQ+FEUz3NqUcNAHkQcvFMdiKXT/n63neBxHulCX7x7MAH6t9bQY81W
  draft: true
  prerelease: false
  force_update: false
  artifact: executable

test: off
